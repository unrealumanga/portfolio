# Workflow that regenerates data/manifest.json whenever projects/ or data/projects.json changes.
name: Update manifest

on:
  push:
    paths:
      - 'projects/**'
      - 'data/projects.json'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate manifest
        run: npm run manifest

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: regenerate manifest.json'
          title: 'chore: auto‑update manifest.json'
          body: |
            🤖 This PR is auto‑generated by the GitHub Action.

            It updates `data/manifest.json` to reflect the current state of `/projects/` folders.
            This is what makes adding projects a zero‑code task after the initial setup.

            Review the changes, then merge or close as appropriate.
          delete-branch: true
          branch-suffix: timestamp
